name: Release

# 推送 v1.2.3 或 v1.2.3-beta.1/-rc.1 形式的 tag 时触发：Android 与桌面端并行构建，
# 两端都成功后才创建 GitHub Release，避免发出缺一端安装包的版本。
# 预发布 tag 必须打在 dev 上，正式版 tag 必须打在 main 上，否则直接失败。
# 手动运行为演练：按输入的版本号打两端安装包、作为 artifact 留存，不创建 Release
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: '演练用版本号，如 1.2.3 或 1.2.3-beta.1（不带 v）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # 版本号只解析一次，两端构建与发布共用
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.version.outputs.name }}
      code: ${{ steps.version.outputs.code }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      # 校验 tag 所在分支需要完整历史与远端分支
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 从 tag 解析版本号
        id: version
        env:
          DRY_RUN_VERSION: ${{ github.event.inputs.version }}
        run: |
          TAG_NAME=${DRY_RUN_VERSION:-${GITHUB_REF_NAME#v}}
          BASE_VERSION=${TAG_NAME%%-*}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
          if ! [[ "$MAJOR" =~ ^[0-9]+$ && "$MINOR" =~ ^[0-9]+$ && "$PATCH" =~ ^[0-9]+$ ]]; then
            echo "tag 格式不是 vMAJOR.MINOR.PATCH[-beta.N|-rc.N]：$TAG_NAME" >&2
            exit 1
          fi

          # 预发布 tag 用 v1.2.3-beta.1 / v1.2.3-rc.1 形式，同一版本号下 beta < rc < 正式版，
          # 保证 versionCode 严格递增，覆盖安装不会被系统当成降级拒绝
          if [ "$TAG_NAME" = "$BASE_VERSION" ]; then
            PRERELEASE=false
            SUB_CODE=99
          else
            PRERELEASE=true
            SUFFIX=${TAG_NAME#"$BASE_VERSION"-}
            KIND=${SUFFIX%%.*}
            NUM=${SUFFIX#*.}
            if ! [[ "$NUM" =~ ^[0-9]+$ ]]; then
              echo "预发布 tag 需要形如 v1.2.3-beta.1 的编号：$TAG_NAME" >&2
              exit 1
            fi
            case "$KIND" in
              beta)
                if [ "$NUM" -gt 49 ]; then
                  echo "beta 编号超出上限 49：$NUM" >&2
                  exit 1
                fi
                SUB_CODE=$NUM
                ;;
              rc)
                if [ "$NUM" -gt 48 ]; then
                  echo "rc 编号超出上限 48：$NUM" >&2
                  exit 1
                fi
                SUB_CODE=$((50 + NUM))
                ;;
              *)
                echo "不支持的预发布类型（仅支持 beta/rc）：$KIND" >&2
                exit 1
                ;;
            esac
          fi

          VERSION_CODE=$(( (MAJOR * 10000 + MINOR * 100 + PATCH) * 100 + SUB_CODE ))
          echo "name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      # 手动演练没有 tag，按所选分支构建，不做校验
      - name: 校验 tag 所在分支
        if: github.event_name == 'push'
        env:
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            BRANCH=dev
          else
            BRANCH=main
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$BRANCH"; then
            echo "tag $GITHUB_REF_NAME 指向的提交 $GITHUB_SHA 不在 $BRANCH 分支上，预发布需打在 dev、正式版需打在 main" >&2
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME 位于 $BRANCH 分支"

  android:
    needs: version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      # certutil -encode 会在内容前后包一层 -----BEGIN/END CERTIFICATE----- 分隔行，
      # 这两行不是合法 base64 字符，grep 过滤掉再拼接解码，兼容两种生成方式
      - name: 写入签名 keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" \
            | grep -v -- '-----BEGIN\|-----END' \
            | tr -d '\r\n' \
            | base64 -d > melodia-release.jks

      - name: Release 构建（正式签名）
        env:
          RELEASE_STORE_FILE: melodia-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease \
            -PreleaseVersionName=${{ needs.version.outputs.name }} \
            -PreleaseVersionCode=${{ needs.version.outputs.code }} \
            --no-daemon

      # 四项签名 secret 缺任一项时 build.gradle.kts 会静默退回 debug 签名
      - name: 校验正式签名生效
        run: |
          APK=app/build/outputs/apk/release/Melodia-v${{ needs.version.outputs.name }}-release.apk
          APKSIGNER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -maxdepth 1 -type d | sort -V | tail -1)/apksigner
          DN=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 'certificate DN')
          echo "$DN"
          if echo "$DN" | grep -qi "Android Debug"; then
            echo "检测到 debug 签名，说明 RELEASE_* 四项 secret 未正确注入，已终止发布" >&2
            exit 1
          fi

      - name: 清理 keystore
        if: always()
        run: rm -f melodia-release.jks

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: app/build/outputs/apk/release/Melodia-v${{ needs.version.outputs.name }}-release.apk
          retention-days: 7

  # windows-latest 自带 CMake、VS 2022（编 SMTC 桥接 DLL 与安装/卸载程序）与 WiX 3（打内嵌的 MSI）
  desktop:
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      # libmpv 按 gradle.properties 固定的 Release 下载并校验 SHA256；SMTC 编不出来直接失败
      - name: 桌面端打包
        run: |
          ./gradlew :desktopApp:packageReleaseZip :desktopApp:packageReleaseSetup \
            -PreleaseVersionName=${{ needs.version.outputs.name }} \
            -PrequireSmtc=true \
            -PrequireUninstaller=true \
            --no-daemon

      - name: 整理安装包
        run: |
          OUT=desktopApp/build/compose/binaries/main-release
          mkdir -p dist
          cp "$OUT/zip/Melodia-v${{ needs.version.outputs.name }}-windows-x64.zip" dist/
          cp "$OUT/setup/Melodia-v${{ needs.version.outputs.name }}-windows-x64-setup.exe" dist/
          ls -l dist

      - name: 上传桌面端安装包
        uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: dist/*
          retention-days: 7

  publish:
    needs: [version, android, desktop]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      # 生成分类日志需要完整提交历史和全部 tag，checkout 默认浅克隆（depth=1）拿不到
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载两端安装包
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # 按 commit message 的 conventional commits 前缀（feat/fix/refactor...）自己分类生成
      - name: 生成分类日志
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          RANGE="HEAD"
          [ -n "$PREV_TAG" ] && RANGE="$PREV_TAG..HEAD"

          declare -A TITLES=(
            [feat]="✨ 新功能" [fix]="🐛 修复" [refactor]="♻️ 重构"
            [perf]="⚡ 性能" [docs]="📝 文档" [test]="✅ 测试"
            [build]="📦 构建" [ci]="🔧 CI" [chore]="🧹 杂项" [style]="🎨 样式"
          )
          ORDER=(feat fix refactor perf build docs test ci chore style)
          declare -A BUCKETS
          OTHER=""

          while IFS= read -r line; do
            [ -z "$line" ] && continue
            TYPE=$(echo "$line" | grep -oE '^[a-z]+' || true)
            if [ -n "$TYPE" ] && [ -n "${TITLES[$TYPE]:-}" ]; then
              BUCKETS[$TYPE]="${BUCKETS[$TYPE]:-}"$'\n'"- $line"
            else
              OTHER="$OTHER"$'\n'"- $line"
            fi
          done < <(git log "$RANGE" --no-merges --pretty=format:'%s')

          {
            for t in "${ORDER[@]}"; do
              if [ -n "${BUCKETS[$t]:-}" ]; then
                echo "### ${TITLES[$t]}"
                echo "${BUCKETS[$t]}"
                echo ""
              fi
            done
            if [ -n "$OTHER" ]; then
              echo "### 📌 其他"
              echo "$OTHER"
              echo ""
            fi
            echo "### 💻 桌面端安装说明"
            echo "- Windows 10 及以上 64 位系统，提供安装程序（setup.exe）与免安装 zip"
            echo "- 安装程序支持静默安装：\`setup.exe /S [/allusers] [/nodesktop] [/autostart] [/run] [/D=安装目录]\`"
            echo "- 安装包暂未做代码签名，首次运行若出现 SmartScreen 提示，点击「更多信息」→「仍要运行」即可"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$PREV_TAG...${GITHUB_REF_NAME}"
            fi
          } > release-notes.md

          cat release-notes.md

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          body_path: release-notes.md
          prerelease: ${{ needs.version.outputs.prerelease }}
          files: dist/*
