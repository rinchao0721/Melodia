name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/plugin-format.md'
      - 'docs/skin-format.md'
      - 'docs/plugin-catalog.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 不取消正在进行的发布，避免站点停在半更新状态
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build

      - uses: actions/configure-pages@v5

      # 只上传构建产物，仓库其余文件不会出现在站点上
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
