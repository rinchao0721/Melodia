name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# 同一分支上的新推送取消仍在跑的旧任务，避免排队浪费
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      # shared 的测试跑在桌面 JVM 目标上，覆盖网络、加密与仓储层；桌面端依赖 libmpv 的用例在 Linux 上自动跳过
      - name: 单元测试
        run: ./gradlew :app:testDebugUnitTest :shared:desktopTest :desktopApp:test --no-daemon

      # 桌面端只做编译检查，安装包在发版时由 Windows runner 打
      - name: 桌面端编译
        run: ./gradlew :desktopApp:compileKotlin --no-daemon

      # release 构建同时验证 R8 规则：接口或序列化器被误裁时此步会失败
      - name: Release 构建（含 R8）
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            app/build/reports/tests/
            shared/build/reports/tests/
            desktopApp/build/reports/tests/
          retention-days: 7

      - name: 上传 APK 与混淆映射
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 14
