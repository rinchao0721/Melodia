name: Bug 反馈
description: 报告 Melodia 中遇到的问题或异常行为
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈问题！请尽量完整填写以下信息，方便快速定位和复现。

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 简要描述遇到的问题
      placeholder: 例如：切换随机播放模式后，歌曲会反复自动重置
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请列出能稳定复现问题的操作步骤
      placeholder: |
        1. 打开某个歌单并播放
        2. 点击随机播放按钮
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
      description: 正常情况下应该发生什么
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 实际发生了什么，可附截图、录屏或日志
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: 应用版本
      description: 在「设置 - 关于」中查看
      placeholder: 例如：1.2.0
    validations:
      required: true

  - type: input
    id: android-version
    attributes:
      label: Android 系统版本
      placeholder: 例如：Android 14
    validations:
      required: true

  - type: input
    id: device-model
    attributes:
      label: 设备型号
      placeholder: 例如：Xiaomi 14 Pro
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: 如有崩溃日志或应用内日志导出文件，请粘贴关键内容或拖拽附件
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前请确认
      options:
        - label: 已搜索过现有 Issue，确认没有重复反馈
          required: true
        - label: 已在最新版本上复现该问题
          required: false
