name: 功能建议
description: 为 Melodia 提出新功能或改进建议
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        感谢提出建议！请尽量描述清楚使用场景，方便评估可行性。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / 使用场景
      description: 当前遇到了什么不便，或者希望满足什么需求
      placeholder: 例如：切换歌曲时希望有淡入淡出效果，避免突兀
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 期望的实现方式或交互效果，可附草图、参考截图
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 是否考虑过其他实现方式，以及为什么没有选择它们
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前请确认
      options:
        - label: 已搜索过现有 Issue，确认没有重复建议
          required: true
